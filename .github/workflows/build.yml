name: Build

on:
  push:
    branches:
      - ver/26.2
    tags:
      - "ver-*"
  pull_request:
    branches:
      - ver/26.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Git for patch application
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # paperweight applies patches by committing into the Git repositories it generates,
          # then walks those .git directories to copy/check them out. Applying the full Leaf
          # stack creates enough loose objects to cross git's gc.auto threshold; the resulting
          # gc detaches into the background, packs the objects and deletes the objects/NN
          # fan-out directories mid-walk. That surfaces as:
          #   NoSuchFileException: .../.git/objects/NN
          # Disable automatic gc for the runner, and keep any explicit gc in the foreground.
          git config --global gc.auto 0
          git config --global gc.autoDetach false

      # paperweight applies the upstream (Leaf -> Paper) and our root patch sets first,
      # then the server patches in a second invocation, as the generated project build
      # files must exist before :pyzh-server can configure.
      - name: Apply patches
        run: |
          ./gradlew applyAllPatches --stacktrace --no-daemon
          ./gradlew :pyzh-server:applyAllServerPatches --stacktrace --no-daemon

      - name: Build and test
        run: ./gradlew build createPaperclipJar --stacktrace --no-daemon

      # The paperclip jar is ~82 MB. Uploading it on every push exhausts the organisation's
      # Actions artifact storage, which fails the run for reasons unrelated to the build.
      # Every push still builds and tests; artifacts are produced for releases and on demand.
      - name: Upload server JAR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: pyzh-${{ github.sha }}
          path: pyzh-server/build/libs/pyzh-paperclip-*.jar
          if-no-files-found: error
          retention-days: 14
